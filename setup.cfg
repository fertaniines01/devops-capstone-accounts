[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-package=service
cover-erase=1

[coverage:run]
source = service
omit =
    service/__init__.py

[coverage:report]
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,venv,.venv,build,dist
select = E9,F63,F7,F82

[pylint]
max-line-length = 127
disable =
    C0111,
    R0903
